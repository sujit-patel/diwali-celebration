<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#cc8800"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fb8500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(250, 250)">
    <!-- Glow -->
    <circle r="220" fill="url(#centerGlow)"/>

    <!-- Concentric rings with dots -->
    <circle r="230" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4,8" opacity="0.6"/>
    <circle r="215" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>
    <circle r="200" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>
    
    <!-- 16 Outer Lotus Petals -->
    <g id="petals-16" stroke="url(#goldGrad)" fill="none" stroke-width="1.8" opacity="0.85">
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" fill="rgba(255, 215, 0, 0.05)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(22.5)" fill="rgba(255, 183, 3, 0.04)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(45)" fill="rgba(255, 215, 0, 0.05)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(67.5)" fill="rgba(255, 183, 3, 0.04)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(90)" fill="rgba(255, 215, 0, 0.05)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(112.5)" fill="rgba(255, 183, 3, 0.04)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(135)" fill="rgba(255, 215, 0, 0.05)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(157.5)" fill="rgba(255, 183, 3, 0.04)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(180)" fill="rgba(255, 215, 0, 0.05)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(202.5)" fill="rgba(255, 183, 3, 0.04)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(225)" fill="rgba(255, 215, 0, 0.05)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(247.5)" fill="rgba(255, 183, 3, 0.04)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(270)" fill="rgba(255, 215, 0, 0.05)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(292.5)" fill="rgba(255, 183, 3, 0.04)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(315)" fill="rgba(255, 215, 0, 0.05)"/>
      <path d="M 0,-200 C 35,-160 35,-110 0,-90 C -35,-110 -35,-160 0,-200 Z" transform="rotate(337.5)" fill="rgba(255, 183, 3, 0.04)"/>
    </g>

    <!-- Mid ring -->
    <circle r="120" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle r="110" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,6"/>

    <!-- 8 Inner Lotus Petals -->
    <g id="petals-8" stroke="url(#goldGrad)" fill="rgba(255, 215, 0, 0.1)" stroke-width="2">
      <path d="M 0,-110 C 25,-85 25,-55 0,-40 C -25,-55 -25,-85 0,-110 Z"/>
      <path d="M 0,-110 C 25,-85 25,-55 0,-40 C -25,-55 -25,-85 0,-110 Z" transform="rotate(45)"/>
      <path d="M 0,-110 C 25,-85 25,-55 0,-40 C -25,-55 -25,-85 0,-110 Z" transform="rotate(90)"/>
      <path d="M 0,-110 C 25,-85 25,-55 0,-40 C -25,-55 -25,-85 0,-110 Z" transform="rotate(135)"/>
      <path d="M 0,-110 C 25,-85 25,-55 0,-40 C -25,-55 -25,-85 0,-110 Z" transform="rotate(180)"/>
      <path d="M 0,-110 C 25,-85 25,-55 0,-40 C -25,-55 -25,-85 0,-110 Z" transform="rotate(225)"/>
      <path d="M 0,-110 C 25,-85 25,-55 0,-40 C -25,-55 -25,-85 0,-110 Z" transform="rotate(270)"/>
      <path d="M 0,-110 C 25,-85 25,-55 0,-40 C -25,-55 -25,-85 0,-110 Z" transform="rotate(315)"/>
    </g>

    <!-- Central Core -->
    <circle r="40" fill="url(#goldGrad)" opacity="0.3"/>
    <circle r="30" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle r="18" fill="url(#goldGrad)"/>
    <circle r="6" fill="#fff"/>
  </g>
</svg>
